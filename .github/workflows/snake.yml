name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: BuildBy-Utkarsh
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23f76707&color_dots=%23ebedf0,%23fff3bf,%23ffe066,%23ffc078,%23ff922b
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffb000&color_dots=%23161b22,%234a2c16,%238c4b12,%23d97706,%23ffb000

      - name: Push generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
