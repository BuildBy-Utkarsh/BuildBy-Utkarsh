name: Generate GitHub Profile Stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile stats
        uses: anuraghazra/github-readme-stats@master
        with:
          username: BuildBy-Utkarsh
